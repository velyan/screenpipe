name: Release Moya Sidecar

on:
  workflow_dispatch:
    inputs:
      sidecar_version:
        description: "Optional expected screenpipe version. If set, it must match the built Cargo.toml version."
        required: false
        default: ""
      screenpipe_ref:
        description: "Git ref to build (branch, tag, or commit SHA)"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub release as prerelease"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      resolved_ref: ${{ steps.ref.outputs.value }}
      resolved_sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.screenpipe_ref }}" ]]; then
            echo "value=${{ github.event.inputs.screenpipe_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Resolve screenpipe version
        id: version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ github.event.inputs.sidecar_version }}
        run: |
          set -euo pipefail

          VERSION="$(python3 - <<'PY'
          import re

          in_workspace_package = False
          version = None

          with open("Cargo.toml", "r", encoding="utf-8") as f:
              for raw_line in f:
                  line = raw_line.strip()
                  if line.startswith("[") and line.endswith("]"):
                      in_workspace_package = line == "[workspace.package]"
                      continue
                  if not in_workspace_package:
                      continue
                  match = re.match(r'^version\s*=\s*"([^"]+)"$', line)
                  if match:
                      version = match.group(1)
                      break

          if not version:
              raise SystemExit("failed to resolve workspace.package.version from Cargo.toml")

          print(version)
          PY
          )"

          if [[ -n "${EXPECTED_VERSION}" && "${EXPECTED_VERSION}" != "${VERSION}" ]]; then
            echo "sidecar_version mismatch: expected ${EXPECTED_VERSION}, resolved ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-macos:
    runs-on: ${{ matrix.runner }}
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.resolved_sha }}

      - name: Verify source checkout
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve-release.outputs.resolved_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_COMMIT}" ]]; then
            echo "Checked out source does not match resolved commit ${SOURCE_COMMIT}." >&2
            exit 1
          fi

          ORT_SYS_VERSION="$(
            python3 - <<'PY'
          import tomllib

          with open("Cargo.lock", "rb") as cargo_lock:
              packages = tomllib.load(cargo_lock)["package"]

          versions = sorted(
              {package["version"] for package in packages if package["name"] == "ort-sys"}
          )
          if len(versions) != 1:
              raise SystemExit(f"expected exactly one ort-sys version, got {versions}")
          print(versions[0])
          PY
          )"
          if [[ "${ORT_SYS_VERSION}" != "2.0.0-rc.10" ]]; then
            echo "Unsupported ort-sys version ${ORT_SYS_VERSION}; update the pinned ONNX Runtime contract." >&2
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        shell: bash
        run: |
          brew unlink pkg-config@0.29.2 || true
          brew install ffmpeg nasm pkg-config
          brew link --overwrite pkg-config

      - name: Prefetch checksum-pinned ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail

          ORT_VERSION="1.22.0"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              ORT_ARCHIVE_SHA="00FBFD6F08BAC2A4E28C66723AF900D58D1B4B1C73EFBA6290637CD3019883D5"
              EXPECTED_ARCH="arm64"
              ;;
            x86_64-apple-darwin)
              ORT_ARCHIVE_SHA="E0538783248BBB77D2E97556134B8CC47CFC35AC3D762067D51EAF8355C0F48E"
              EXPECTED_ARCH="x86_64"
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          ORT_ARCHIVE_URL="https://cdn.pyke.io/0/pyke:ort-rs/ms@${ORT_VERSION}/${{ matrix.target }}.tgz"
          ORT_EXTRACT_DIR="${RUNNER_TEMP}/onnxruntime-${{ matrix.target }}-${ORT_ARCHIVE_SHA}"
          ORT_ARCHIVE="${RUNNER_TEMP}/onnxruntime-${{ matrix.target }}.tgz"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            --output "${ORT_ARCHIVE}" \
            "${ORT_ARCHIVE_URL}"

          ACTUAL_ORT_SHA="$(shasum -a 256 "${ORT_ARCHIVE}" | awk '{print toupper($1)}')"
          if [[ "${ACTUAL_ORT_SHA}" != "${ORT_ARCHIVE_SHA}" ]]; then
            echo "ONNX Runtime checksum mismatch: expected ${ORT_ARCHIVE_SHA}, got ${ACTUAL_ORT_SHA}." >&2
            exit 1
          fi

          mkdir -p "${ORT_EXTRACT_DIR}"
          tar -xzf "${ORT_ARCHIVE}" -C "${ORT_EXTRACT_DIR}"
          ORT_LIBRARY="${ORT_EXTRACT_DIR}/onnxruntime/lib/libonnxruntime.a"
          if [[ ! -f "${ORT_LIBRARY}" ]]; then
            echo "ONNX Runtime archive did not contain ${ORT_LIBRARY}." >&2
            exit 1
          fi
          if ! lipo "${ORT_LIBRARY}" -verify_arch "${EXPECTED_ARCH}" >/dev/null 2>&1; then
            echo "ONNX Runtime library is missing required architecture ${EXPECTED_ARCH}." >&2
            exit 1
          fi
          echo "ORT_LIB_LOCATION=${ORT_EXTRACT_DIR}/onnxruntime" >> "${GITHUB_ENV}"

      - name: Build screenpipe server binary
        shell: bash
        run: |
          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="${BREW_PREFIX}/opt/ffmpeg/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_ALLOW_CROSS=1
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            export CFLAGS="-mcpu=apple-m1 -U__ARM_FEATURE_MATMUL_INT8"
            export CXXFLAGS="-mcpu=apple-m1 -U__ARM_FEATURE_MATMUL_INT8"
          fi
          cargo build -p screenpipe-engine --bin screenpipe --release --features metal --target "${{ matrix.target }}"

      - name: Prepare sidecar payload
        shell: bash
        run: |
          set -euo pipefail

          FFMPEG_VERSION="6.1.1"
          FFMPEG_SOURCE_URL="https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          FFMPEG_SOURCE_SHA="8684f4b00f94b85461884c3719382f1261f0d9eb3d59640a1f4ac0873616f968"

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              ARCH="arm64"
              FFMPEG_ARCH="arm64"
              ;;
            x86_64-apple-darwin)
              ARCH="x64"
              FFMPEG_ARCH="x86_64"
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          mkdir -p out
          cp "target/${{ matrix.target }}/release/screenpipe" "out/screenpipe-darwin-${ARCH}"
          chmod +x "out/screenpipe-darwin-${ARCH}"

          curl -fsSL "${FFMPEG_SOURCE_URL}" -o "ffmpeg-source.tar.xz"
          ACTUAL_SOURCE_SHA="$(shasum -a 256 ffmpeg-source.tar.xz | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          if [[ "${ACTUAL_SOURCE_SHA}" != "${FFMPEG_SOURCE_SHA}" ]]; then
            echo "FFmpeg source checksum mismatch: expected ${FFMPEG_SOURCE_SHA}, got ${ACTUAL_SOURCE_SHA}" >&2
            exit 1
          fi
          tar -xf ffmpeg-source.tar.xz

          pushd "ffmpeg-${FFMPEG_VERSION}"
          ./configure \
            --prefix="${PWD}/../ffmpeg-install" \
            --target-os=darwin \
            --arch="${FFMPEG_ARCH}" \
            --cc=clang \
            --extra-cflags="-arch ${FFMPEG_ARCH}" \
            --extra-ldflags="-arch ${FFMPEG_ARCH}" \
            --enable-cross-compile \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --enable-audiotoolbox \
            --enable-videotoolbox

          if grep -Eq '^CONFIG_(GPL|NONFREE)=yes$' ffbuild/config.mak; then
            echo "Refusing to package FFmpeg with GPL or nonfree components enabled." >&2
            exit 1
          fi

          make -j"$(sysctl -n hw.ncpu)" ffmpeg ffprobe
          popd

          cp "ffmpeg-${FFMPEG_VERSION}/ffmpeg" "out/ffmpeg-darwin-${ARCH}"
          cp "ffmpeg-${FFMPEG_VERSION}/ffprobe" "out/ffprobe-darwin-${ARCH}"
          chmod +x "out/ffmpeg-darwin-${ARCH}" "out/ffprobe-darwin-${ARCH}"

          if ! lipo "out/ffmpeg-darwin-${ARCH}" -verify_arch "${FFMPEG_ARCH}" >/dev/null 2>&1; then
            echo "FFmpeg payload is missing required architecture ${FFMPEG_ARCH}." >&2
            exit 1
          fi

          if [[ "$(uname -m)" == "${FFMPEG_ARCH}" ]]; then
            FFMPEG_VERSION_OUTPUT="$(out/ffmpeg-darwin-${ARCH} -version)"
            printf '%s\n' "${FFMPEG_VERSION_OUTPUT}"
            if grep -Eq -- '--enable-(gpl|nonfree)' <<<"${FFMPEG_VERSION_OUTPUT}"; then
              echo "Refusing to package FFmpeg built with GPL or nonfree options." >&2
              exit 1
            fi
            if ! out/ffmpeg-darwin-${ARCH} -hide_banner -encoders 2>/dev/null | grep -q 'hevc_videotoolbox'; then
              echo "FFmpeg payload is missing the required hevc_videotoolbox encoder." >&2
              exit 1
            fi

            mkdir -p ffmpeg-smoke
            out/ffmpeg-darwin-${ARCH} \
              -hide_banner \
              -loglevel error \
              -f lavfi \
              -i "color=size=321x241:rate=1" \
              -frames:v 1 \
              ffmpeg-smoke/input.png
            out/ffmpeg-darwin-${ARCH} \
              -hide_banner \
              -loglevel error \
              -f lavfi \
              -i "color=size=321x241:rate=1" \
              -frames:v 1 \
              ffmpeg-smoke/input.jpg

            cat ffmpeg-smoke/input.png ffmpeg-smoke/input.png |
              out/ffmpeg-darwin-${ARCH} \
                -hide_banner \
                -loglevel error \
                -f image2pipe \
                -vcodec png \
                -r 1 \
                -i - \
                -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
                -vcodec hevc_videotoolbox \
                -tag:v hvc1 \
                -q:v 55 \
                -allow_sw 1 \
                -realtime 1 \
                -bf 0 \
                -movflags frag_keyframe+empty_moov+default_base_moof \
                -pix_fmt yuv420p \
                ffmpeg-smoke/png-pipeline.mp4

            cat ffmpeg-smoke/input.jpg ffmpeg-smoke/input.jpg |
              out/ffmpeg-darwin-${ARCH} \
                -hide_banner \
                -loglevel error \
                -f image2pipe \
                -vcodec mjpeg \
                -r 1 \
                -i - \
                -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
                -vcodec hevc_videotoolbox \
                -tag:v hvc1 \
                -q:v 55 \
                -allow_sw 1 \
                -realtime 0 \
                -bf 0 \
                -movflags frag_keyframe+empty_moov+default_base_moof \
                -pix_fmt yuv420p \
                ffmpeg-smoke/mjpeg-pipeline.mp4

            assert_stream_contract() {
              local media_path="$1"
              local probe_json
              probe_json="$(
                out/ffprobe-darwin-${ARCH} \
                  -v error \
                  -select_streams v:0 \
                  -show_entries stream=codec_name,codec_tag_string,pix_fmt,has_b_frames \
                  -of json \
                  "${media_path}"
              )"
              PROBE_JSON="${probe_json}" python3 - "${media_path}" <<'PY'
          import json
          import os
          import sys

          media_path = sys.argv[1]
          streams = json.loads(os.environ["PROBE_JSON"]).get("streams", [])
          if len(streams) != 1:
              raise SystemExit(f"{media_path}: expected one video stream, got {len(streams)}")

          stream = streams[0]
          expected = {
              "codec_name": "hevc",
              "codec_tag_string": "hvc1",
              "pix_fmt": "yuv420p",
              "has_b_frames": 0,
          }
          actual = {key: stream.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(
                  f"{media_path}: unexpected stream contract: {actual}, expected {expected}"
              )
          PY
            }

            assert_stream_contract ffmpeg-smoke/png-pipeline.mp4
            assert_stream_contract ffmpeg-smoke/mjpeg-pipeline.mp4
          else
            echo "Skipping execution of cross-compiled ${FFMPEG_ARCH} FFmpeg slice on $(uname -m) host."
          fi

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: moya-sidecar-${{ matrix.target }}
          path: out/*

  package-universal:
    runs-on: macos-latest
    needs: build-macos
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build universal sidecar payload
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          create_universal_binary() {
            local name="$1"
            local arm64_path="artifacts/moya-sidecar-aarch64-apple-darwin/${name}-darwin-arm64"
            local x64_path="artifacts/moya-sidecar-x86_64-apple-darwin/${name}-darwin-x64"
            local output_path="out/${name}-darwin-universal"

            if [[ ! -f "${arm64_path}" || ! -f "${x64_path}" ]]; then
              echo "Missing architecture slices for ${name}" >&2
              exit 1
            fi

            lipo -create "${arm64_path}" "${x64_path}" -output "${output_path}"
            chmod +x "${output_path}"
            if ! lipo "${output_path}" -verify_arch arm64 x86_64 >/dev/null 2>&1; then
              echo "Universal merge failed for ${name}: $(lipo -info "${output_path}" 2>/dev/null || file -b "${output_path}")" >&2
              exit 1
            fi
          }

          create_universal_binary screenpipe
          create_universal_binary ffmpeg
          create_universal_binary ffprobe

          FFMPEG_VERSION_OUTPUT="$(out/ffmpeg-darwin-universal -version)"
          printf '%s\n' "${FFMPEG_VERSION_OUTPUT}"
          if grep -Eq -- '--enable-(gpl|nonfree)' <<<"${FFMPEG_VERSION_OUTPUT}"; then
            echo "Refusing to package universal FFmpeg with GPL or nonfree options." >&2
            exit 1
          fi
          if ! out/ffmpeg-darwin-universal -hide_banner -encoders 2>/dev/null | grep -q 'hevc_videotoolbox'; then
            echo "Universal FFmpeg payload is missing the required hevc_videotoolbox encoder." >&2
            exit 1
          fi

          mkdir -p ffmpeg-smoke
          out/ffmpeg-darwin-universal \
            -hide_banner \
            -loglevel error \
            -f lavfi \
            -i "color=size=320x240:rate=1" \
            -frames:v 2 \
            -c:v hevc_videotoolbox \
            -tag:v hvc1 \
            -q:v 55 \
            -allow_sw 1 \
            -bf 0 \
            -pix_fmt yuv420p \
            ffmpeg-smoke/test.mp4
          CODEC="$(
            out/ffprobe-darwin-universal \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of default=noprint_wrappers=1:nokey=1 \
              ffmpeg-smoke/test.mp4
          )"
          if [[ "${CODEC}" != "hevc" ]]; then
            echo "Universal FFmpeg VideoToolbox smoke test produced unexpected codec: ${CODEC}" >&2
            exit 1
          fi

      - name: Upload universal sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: moya-sidecar-darwin-universal
          path: out/*

  publish-release:
    runs-on: ubuntu-latest
    needs: [resolve-release, build-macos, package-universal]
    concurrency:
      group: moya-sidecar-release-${{ needs.resolve-release.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.resolved_sha }}

      - name: Verify source checkout and license
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.resolve-release.outputs.resolved_sha }}
        run: |
          set -euo pipefail
          EXPECTED_LICENSE_SHA="688c84ab8bed8b9b60d75e8486eb9e19e3e1f049bf6f9c24f1c5e3fad86777e0"

          if [[ "$(git rev-parse HEAD)" != "${SOURCE_COMMIT}" ]]; then
            echo "Checked out source does not match resolved commit ${SOURCE_COMMIT}." >&2
            exit 1
          fi

          ACTUAL_LICENSE_SHA="$(sha256sum LICENSE.md | awk '{print $1}')"
          if [[ "${ACTUAL_LICENSE_SHA}" != "${EXPECTED_LICENSE_SHA}" ]]; then
            echo "Refusing to publish source without the reviewed Screenpipe MIT license." >&2
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files and manifest
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.resolve-release.outputs.resolved_sha }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail

          export VERSION

          mkdir -p release-assets
          cp artifacts/moya-sidecar-aarch64-apple-darwin/screenpipe-darwin-arm64 release-assets/
          cp artifacts/moya-sidecar-aarch64-apple-darwin/ffmpeg-darwin-arm64 release-assets/
          cp artifacts/moya-sidecar-aarch64-apple-darwin/ffprobe-darwin-arm64 release-assets/
          cp artifacts/moya-sidecar-x86_64-apple-darwin/screenpipe-darwin-x64 release-assets/
          cp artifacts/moya-sidecar-x86_64-apple-darwin/ffmpeg-darwin-x64 release-assets/
          cp artifacts/moya-sidecar-x86_64-apple-darwin/ffprobe-darwin-x64 release-assets/
          cp artifacts/moya-sidecar-darwin-universal/screenpipe-darwin-universal release-assets/
          cp artifacts/moya-sidecar-darwin-universal/ffmpeg-darwin-universal release-assets/
          cp artifacts/moya-sidecar-darwin-universal/ffprobe-darwin-universal release-assets/
          cp LICENSE.md release-assets/LICENSE-screenpipe-MIT.md

          FFMPEG_VERSION="6.1.1"
          FFMPEG_SOURCE_URL="https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          FFMPEG_SOURCE_SHA="8684f4b00f94b85461884c3719382f1261f0d9eb3d59640a1f4ac0873616f968"
          curl -fsSL "${FFMPEG_SOURCE_URL}" -o "release-assets/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          ACTUAL_SOURCE_SHA="$(
            sha256sum "release-assets/ffmpeg-${FFMPEG_VERSION}.tar.xz" | awk '{print $1}'
          )"
          if [[ "${ACTUAL_SOURCE_SHA}" != "${FFMPEG_SOURCE_SHA}" ]]; then
            echo "FFmpeg source checksum mismatch: expected ${FFMPEG_SOURCE_SHA}, got ${ACTUAL_SOURCE_SHA}" >&2
            exit 1
          fi
          tar -xOf "release-assets/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            "ffmpeg-${FFMPEG_VERSION}/COPYING.LGPLv2.1" \
            > release-assets/LICENSE-FFmpeg-LGPL-2.1.txt
          tar -xOf "release-assets/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            "ffmpeg-${FFMPEG_VERSION}/COPYING.LGPLv3" \
            > release-assets/LICENSE-FFmpeg-LGPL-3.txt

          ORT_VERSION="1.22.0"
          ORT_LICENSE_URL="https://raw.githubusercontent.com/microsoft/onnxruntime/v${ORT_VERSION}/LICENSE"
          ORT_LICENSE_SHA="2f07c72751aed99790b8a4869cf2311df85a860b22ded05fa22803587a48922c"
          ORT_NOTICES_URL="https://raw.githubusercontent.com/microsoft/onnxruntime/v${ORT_VERSION}/ThirdPartyNotices.txt"
          ORT_NOTICES_SHA="e9e90971a8e75a9a8ac0c6412e29c1202d079998389915aa485f46c816c3b4cc"

          curl -fsSL "${ORT_LICENSE_URL}" -o release-assets/LICENSE-ONNX-Runtime-MIT.txt
          curl -fsSL "${ORT_NOTICES_URL}" -o release-assets/THIRD-PARTY-NOTICES-ONNX-Runtime.txt
          ACTUAL_ORT_LICENSE_SHA="$(
            sha256sum release-assets/LICENSE-ONNX-Runtime-MIT.txt | awk '{print $1}'
          )"
          ACTUAL_ORT_NOTICES_SHA="$(
            sha256sum release-assets/THIRD-PARTY-NOTICES-ONNX-Runtime.txt | awk '{print $1}'
          )"
          if [[ "${ACTUAL_ORT_LICENSE_SHA}" != "${ORT_LICENSE_SHA}" ]]; then
            echo "ONNX Runtime license checksum mismatch." >&2
            exit 1
          fi
          if [[ "${ACTUAL_ORT_NOTICES_SHA}" != "${ORT_NOTICES_SHA}" ]]; then
            echo "ONNX Runtime third-party notices checksum mismatch." >&2
            exit 1
          fi

          cat > release-assets/FFmpeg-build-info.txt <<EOF
          FFmpeg source: ${FFMPEG_SOURCE_URL}
          FFmpeg source SHA-256: ${FFMPEG_SOURCE_SHA}
          FFmpeg version: ${FFMPEG_VERSION}

          These FFmpeg and FFprobe executables are separate programs invoked by
          Screenpipe. They were built without --enable-gpl or --enable-nonfree.

          Common configure arguments:
            --target-os=darwin --cc=clang --enable-cross-compile
            --enable-static --disable-shared --disable-debug --disable-doc
            --disable-ffplay --enable-audiotoolbox --enable-videotoolbox

          arm64 additions:
            --arch=arm64 --extra-cflags="-arch arm64" --extra-ldflags="-arch arm64"

          x86_64 additions:
            --arch=x86_64 --extra-cflags="-arch x86_64" --extra-ldflags="-arch x86_64"
          EOF
          cat > release-assets/ONNX-Runtime-build-info.txt <<EOF
          ONNX Runtime version: ${ORT_VERSION}
          ONNX Runtime source: https://github.com/microsoft/onnxruntime/tree/v${ORT_VERSION}

          The Screenpipe executable statically links checksum-pinned ONNX Runtime
          archives supplied by the ort-rs distribution service:

          arm64:
            https://cdn.pyke.io/0/pyke:ort-rs/ms@${ORT_VERSION}/aarch64-apple-darwin.tgz
            SHA-256: 00fbfd6f08bac2a4e28c66723af900d58d1b4b1c73efba6290637cd3019883d5

          x86_64:
            https://cdn.pyke.io/0/pyke:ort-rs/ms@${ORT_VERSION}/x86_64-apple-darwin.tgz
            SHA-256: e0538783248bbb77d2e97556134b8cc47cfc35ac3d762067d51eaf8355c0f48e
          EOF

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["SOURCE_COMMIT"]
          tag = f"moya-sidecar-v{version}"
          base_url = f"https://github.com/{repo}/releases/download/{tag}"
          root = Path("release-assets")

          def entry(filename: str) -> dict:
              path = root / filename
              data = path.read_bytes()
              return {
                  "url": f"{base_url}/{filename}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "sizeBytes": path.stat().st_size,
              }

          manifest = {
              "version": version,
              "commit": commit,
              "assets": {
                  "darwin-arm64": {
                      "screenpipe": entry("screenpipe-darwin-arm64"),
                      "ffmpeg": entry("ffmpeg-darwin-arm64"),
                      "ffprobe": entry("ffprobe-darwin-arm64"),
                  },
                  "darwin-x64": {
                      "screenpipe": entry("screenpipe-darwin-x64"),
                      "ffmpeg": entry("ffmpeg-darwin-x64"),
                      "ffprobe": entry("ffprobe-darwin-x64"),
                  },
                  "darwin-universal": {
                      "screenpipe": entry("screenpipe-darwin-universal"),
                      "ffmpeg": entry("ffmpeg-darwin-universal"),
                      "ffprobe": entry("ffprobe-darwin-universal"),
                  },
              },
              "notices": {
                  "screenpipeLicense": entry("LICENSE-screenpipe-MIT.md"),
                  "ffmpegLGPL21": entry("LICENSE-FFmpeg-LGPL-2.1.txt"),
                  "ffmpegLGPL3": entry("LICENSE-FFmpeg-LGPL-3.txt"),
                  "ffmpegBuildInfo": entry("FFmpeg-build-info.txt"),
                  "ffmpegSource": entry("ffmpeg-6.1.1.tar.xz"),
                  "onnxRuntimeLicense": entry("LICENSE-ONNX-Runtime-MIT.txt"),
                  "onnxRuntimeThirdPartyNotices": entry("THIRD-PARTY-NOTICES-ONNX-Runtime.txt"),
                  "onnxRuntimeBuildInfo": entry("ONNX-Runtime-build-info.txt"),
              },
          }

          manifest_path = root / "moya-sidecar-manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          manifest_hash = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          (root / "moya-sidecar-manifest.sha256").write_text(
              f"{manifest_hash}  moya-sidecar-manifest.json\n",
              encoding="utf-8",
          )
          PY

      - name: Create and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.resolve-release.outputs.resolved_sha }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="moya-sidecar-v${VERSION}"
          TITLE="Moya Sidecar ${VERSION}"
          NOTES_FILE="release-assets/release-notes.md"

          cat > "${NOTES_FILE}" <<EOF
          Moya sidecar release ${VERSION}

          Source commit: https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_COMMIT}

          Licensing:
          - Screenpipe source in this release is from the MIT-licensed lineage; see LICENSE-screenpipe-MIT.md.
          - Bundled FFmpeg and FFprobe are LGPL-only builds made from the attached, checksum-pinned FFmpeg 6.1.1 source.
          - FFmpeg was built without --enable-gpl and without --enable-nonfree. Exact configure arguments are in FFmpeg-build-info.txt.
          - Screenpipe statically links checksum-pinned ONNX Runtime 1.22.0 archives. Its MIT license, third-party notices, and build provenance are attached.
          EOF

          if TAG_COMMIT="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null
          )"; then
            if [[ "${TAG_COMMIT}" != "${SOURCE_COMMIT}" ]]; then
              echo "Existing tag ${TAG} points to ${TAG_COMMIT}, not ${SOURCE_COMMIT}." >&2
              exit 1
            fi
          fi

          if gh release view "${TAG}" --json isDraft,targetCommitish >/dev/null 2>&1; then
            RELEASE_JSON="$(gh release view "${TAG}" --json isDraft,targetCommitish)"
            IS_DRAFT="$(jq -r .isDraft <<<"${RELEASE_JSON}")"
            RELEASE_TARGET="$(jq -r .targetCommitish <<<"${RELEASE_JSON}")"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Refusing to overwrite already-published release ${TAG}." >&2
              exit 1
            fi
            if [[ "${RELEASE_TARGET}" != "${SOURCE_COMMIT}" ]]; then
              echo "Draft ${TAG} targets ${RELEASE_TARGET}, not ${SOURCE_COMMIT}." >&2
              exit 1
            fi
            echo "Reusing existing draft release ${TAG}."
          else
            gh release create "${TAG}" \
              --target "${SOURCE_COMMIT}" \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}" \
              --draft
          fi

          gh release upload "${TAG}" \
            release-assets/screenpipe-darwin-arm64 \
            release-assets/ffmpeg-darwin-arm64 \
            release-assets/ffprobe-darwin-arm64 \
            release-assets/screenpipe-darwin-x64 \
            release-assets/ffmpeg-darwin-x64 \
            release-assets/ffprobe-darwin-x64 \
            release-assets/screenpipe-darwin-universal \
            release-assets/ffmpeg-darwin-universal \
            release-assets/ffprobe-darwin-universal \
            release-assets/LICENSE-screenpipe-MIT.md \
            release-assets/LICENSE-FFmpeg-LGPL-2.1.txt \
            release-assets/LICENSE-FFmpeg-LGPL-3.txt \
            release-assets/FFmpeg-build-info.txt \
            release-assets/ffmpeg-6.1.1.tar.xz \
            release-assets/LICENSE-ONNX-Runtime-MIT.txt \
            release-assets/THIRD-PARTY-NOTICES-ONNX-Runtime.txt \
            release-assets/ONNX-Runtime-build-info.txt \
            release-assets/moya-sidecar-manifest.json \
            release-assets/moya-sidecar-manifest.sha256 \
            --clobber

          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            gh release edit "${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --draft=false \
              --prerelease
          else
            gh release edit "${TAG}" \
              --notes-file "${NOTES_FILE}" \
              --draft=false \
              --prerelease=false
          fi

          PUBLISHED_TAG_COMMIT="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha
          )"
          if [[ "${PUBLISHED_TAG_COMMIT}" != "${SOURCE_COMMIT}" ]]; then
            echo "Published tag ${TAG} points to ${PUBLISHED_TAG_COMMIT}, not ${SOURCE_COMMIT}." >&2
            exit 1
          fi
