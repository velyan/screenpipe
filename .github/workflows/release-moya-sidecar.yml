name: Release Moya Sidecar

on:
  workflow_dispatch:
    inputs:
      sidecar_version:
        description: "Optional expected screenpipe version. If set, it must match the built Cargo.toml version."
        required: false
        default: ""
      screenpipe_ref:
        description: "Git ref to build (branch, tag, or commit SHA)"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub release as prerelease"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      resolved_ref: ${{ steps.ref.outputs.value }}
      resolved_sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.screenpipe_ref }}" ]]; then
            echo "value=${{ github.event.inputs.screenpipe_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Resolve screenpipe version
        id: version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ github.event.inputs.sidecar_version }}
        run: |
          set -euo pipefail

          VERSION="$(python3 - <<'PY'
          import re

          in_workspace_package = False
          version = None

          with open("Cargo.toml", "r", encoding="utf-8") as f:
              for raw_line in f:
                  line = raw_line.strip()
                  if line.startswith("[") and line.endswith("]"):
                      in_workspace_package = line == "[workspace.package]"
                      continue
                  if not in_workspace_package:
                      continue
                  match = re.match(r'^version\s*=\s*"([^"]+)"$', line)
                  if match:
                      version = match.group(1)
                      break

          if not version:
              raise SystemExit("failed to resolve workspace.package.version from Cargo.toml")

          print(version)
          PY
          )"

          if [[ -n "${EXPECTED_VERSION}" && "${EXPECTED_VERSION}" != "${VERSION}" ]]; then
            echo "sidecar_version mismatch: expected ${EXPECTED_VERSION}, resolved ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-macos:
    runs-on: macos-latest
    needs: resolve-release
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.resolved_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        shell: bash
        run: |
          brew unlink pkg-config@0.29.2 || true
          brew install pkg-config
          brew link --overwrite pkg-config

      - name: Build screenpipe server binary
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            export CFLAGS="-mcpu=apple-m1 -U__ARM_FEATURE_MATMUL_INT8"
            export CXXFLAGS="-mcpu=apple-m1 -U__ARM_FEATURE_MATMUL_INT8"
          fi
          # Moya uses only the vision/accessibility capture APIs and launches
          # the sidecar with audio disabled. Keep heavyweight ASR defaults and
          # the opt-in AGPL Tinfoil client out of the distributable closure.
          cargo build -p screenpipe-engine --bin screenpipe --release --locked --no-default-features --target "${{ matrix.target }}"

      - name: Verify Moya source and dependency license closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(shasum -a 256 LICENSE.md | awk '{print $1}')" = "688c84ab8bed8b9b60d75e8486eb9e19e3e1f049bf6f9c24f1c5e3fad86777e0" || { echo "Screenpipe source is not the approved MIT-licensed revision" >&2; exit 1; }
          TREE="$(cargo tree -p screenpipe-engine --locked --target "${{ matrix.target }}" --no-default-features --edges normal,build --prefix none --format '{p} {l}')"
          if grep -Eiq '(^|[[:space:]])(AGPL|GPL)-' <<<"${TREE}"; then
            echo "Moya sidecar dependency closure contains a prohibited strong-copyleft dependency:" >&2
            grep -Ei '(^|[[:space:]])(AGPL|GPL)-' <<<"${TREE}" >&2
            exit 1
          fi
          if grep -Eiq '(^|[[:space:]])(screenpipe-audio|mp3lame|symphonia|tinfoil|opf-rs|colored)[[:space:]]' <<<"${TREE}"; then
            echo "Moya sidecar dependency closure contains an excluded capability:" >&2
            grep -Ei '(^|[[:space:]])(screenpipe-audio|mp3lame|symphonia|tinfoil|opf-rs|colored)[[:space:]]' <<<"${TREE}" >&2
            exit 1
          fi

      - name: Generate Rust third-party notices
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH="arm64" ;;
            x86_64-apple-darwin) ARCH="x64" ;;
            *) echo "Unsupported target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          mkdir -p out
          python3 scripts/generate_moya_sidecar_notices.py \
            --target "${{ matrix.target }}" \
            --notices "out/THIRD-PARTY-NOTICES-screenpipe-rust-${ARCH}.txt" \
            --inventory "out/DEPENDENCIES-screenpipe-rust-${ARCH}.json"

      - name: Prepare sidecar payload
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH="arm64" ;;
            x86_64-apple-darwin) ARCH="x64" ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          mkdir -p out
          cp "target/${{ matrix.target }}/release/screenpipe" "out/screenpipe-darwin-${ARCH}"
          chmod +x "out/screenpipe-darwin-${ARCH}"

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: moya-sidecar-${{ matrix.target }}
          path: out/*

  package-universal:
    runs-on: macos-latest
    needs: build-macos
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build universal sidecar payload
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          create_universal_binary() {
            local name="$1"
            local arm64_path="artifacts/moya-sidecar-aarch64-apple-darwin/${name}-darwin-arm64"
            local x64_path="artifacts/moya-sidecar-x86_64-apple-darwin/${name}-darwin-x64"
            local output_path="out/${name}-darwin-universal"

            if [[ ! -f "${arm64_path}" || ! -f "${x64_path}" ]]; then
              echo "Missing architecture slices for ${name}" >&2
              exit 1
            fi

            lipo -create "${arm64_path}" "${x64_path}" -output "${output_path}"
            chmod +x "${output_path}"
            if ! lipo "${output_path}" -verify_arch arm64 x86_64 >/dev/null 2>&1; then
              echo "Universal merge failed for ${name}: $(lipo -info "${output_path}" 2>/dev/null || file -b "${output_path}")" >&2
              exit 1
            fi
          }

          create_universal_binary screenpipe

      - name: Upload universal sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: moya-sidecar-darwin-universal
          path: out/*

  publish-release:
    runs-on: ubuntu-latest
    needs: [resolve-release, build-macos, package-universal]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.resolved_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files and manifest
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.resolve-release.outputs.resolved_sha }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail

          export VERSION
          TAG="moya-sidecar-v${VERSION}"

          mkdir -p release-assets
          cp artifacts/moya-sidecar-aarch64-apple-darwin/screenpipe-darwin-arm64 release-assets/
          cp artifacts/moya-sidecar-x86_64-apple-darwin/screenpipe-darwin-x64 release-assets/
          cp artifacts/moya-sidecar-darwin-universal/screenpipe-darwin-universal release-assets/
          cp artifacts/moya-sidecar-aarch64-apple-darwin/THIRD-PARTY-NOTICES-screenpipe-rust-arm64.txt release-assets/
          cp artifacts/moya-sidecar-aarch64-apple-darwin/DEPENDENCIES-screenpipe-rust-arm64.json release-assets/
          cp artifacts/moya-sidecar-x86_64-apple-darwin/THIRD-PARTY-NOTICES-screenpipe-rust-x64.txt release-assets/
          cp artifacts/moya-sidecar-x86_64-apple-darwin/DEPENDENCIES-screenpipe-rust-x64.json release-assets/
          cp LICENSE.md release-assets/LICENSE-screenpipe-MIT.md

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["SOURCE_COMMIT"]
          tag = f"moya-sidecar-v{version}"
          base_url = f"https://github.com/{repo}/releases/download/{tag}"
          root = Path("release-assets")

          def entry(filename: str) -> dict:
              path = root / filename
              data = path.read_bytes()
              return {
                  "url": f"{base_url}/{filename}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "sizeBytes": path.stat().st_size,
              }

          manifest = {
              "version": version,
              "commit": commit,
              "source": {
                  "repository": f"https://github.com/{repo}.git",
                  "ref": "${{ needs.resolve-release.outputs.resolved_ref }}",
                  "commit": commit,
              },
              "assets": {
                  "darwin-arm64": {
                      "screenpipe": entry("screenpipe-darwin-arm64"),
                  },
                  "darwin-x64": {
                      "screenpipe": entry("screenpipe-darwin-x64"),
                  },
                  "darwin-universal": {
                      "screenpipe": entry("screenpipe-darwin-universal"),
                  },
              },
              "notices": {
                  "screenpipeLicense": entry("LICENSE-screenpipe-MIT.md"),
                  "screenpipeRustThirdPartyArm64": entry("THIRD-PARTY-NOTICES-screenpipe-rust-arm64.txt"),
                  "screenpipeRustInventoryArm64": entry("DEPENDENCIES-screenpipe-rust-arm64.json"),
                  "screenpipeRustThirdPartyX64": entry("THIRD-PARTY-NOTICES-screenpipe-rust-x64.txt"),
                  "screenpipeRustInventoryX64": entry("DEPENDENCIES-screenpipe-rust-x64.json"),
              },
          }

          manifest_path = root / "moya-sidecar-manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          manifest_hash = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          (root / "moya-sidecar-manifest.sha256").write_text(
              f"{manifest_hash}  moya-sidecar-manifest.json\n",
              encoding="utf-8",
          )
          PY

      - name: Create and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.resolve-release.outputs.resolved_sha }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="moya-sidecar-v${VERSION}"
          TITLE="Moya Sidecar ${VERSION}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; reusing."
          else
            if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
              gh release create "${TAG}" --target "${SOURCE_COMMIT}" --title "${TITLE}" --notes "Moya sidecar release ${VERSION}" --prerelease
            else
              gh release create "${TAG}" --target "${SOURCE_COMMIT}" --title "${TITLE}" --notes "Moya sidecar release ${VERSION}"
            fi
          fi

          gh release upload "${TAG}" release-assets/screenpipe-darwin-arm64 --clobber
          gh release upload "${TAG}" release-assets/screenpipe-darwin-x64 --clobber
          gh release upload "${TAG}" release-assets/screenpipe-darwin-universal --clobber
          gh release upload "${TAG}" release-assets/LICENSE-screenpipe-MIT.md --clobber
          gh release upload "${TAG}" release-assets/THIRD-PARTY-NOTICES-screenpipe-rust-arm64.txt --clobber
          gh release upload "${TAG}" release-assets/DEPENDENCIES-screenpipe-rust-arm64.json --clobber
          gh release upload "${TAG}" release-assets/THIRD-PARTY-NOTICES-screenpipe-rust-x64.txt --clobber
          gh release upload "${TAG}" release-assets/DEPENDENCIES-screenpipe-rust-x64.json --clobber
          gh release upload "${TAG}" release-assets/moya-sidecar-manifest.json --clobber
          gh release upload "${TAG}" release-assets/moya-sidecar-manifest.sha256 --clobber
